# QA plain-file host: deliberately has NO Next segment rewrites. Portable
# postbuild artifacts must satisfy the same browser URLs without server support.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
