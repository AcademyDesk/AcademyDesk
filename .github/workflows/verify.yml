name: Verify AcademyDesk

on:
  push:
    branches: [main, codex/release-export-security, codex/penta-host-integration-20261030]
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      PENTA_SOURCE_READ_TOKEN:
        description: Read-only contents access to the private PentaMini repository
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    name: API, SQL, private media and frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Prepare source-bound verification output
        run: |
          mkdir -p .build-check/ci QA/EVIDENCE/logs
          git rev-parse HEAD > .build-check/ci/source-commit.txt
      - name: Test production acceptance guard
        run: node --test QA/tools/production-gates.test.cjs
      - name: Restore and audit all API dependencies
        run: >-
          dotnet restore AcademyDesk.slnx
          -p:NuGetAudit=true -p:NuGetAuditMode=all
          '-p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904'
      - name: API regressions
        id: api_tests
        run: >-
          dotnet test AcademyDesk.slnx --no-restore --nologo -m:2
          --logger trx --results-directory .build-check/ci/api-tests
      - name: Install and audit frontend dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=low
      - name: TypeScript and lint
        working-directory: apps/web
        run: |
          npx next typegen
          npx tsc --noEmit
          npm run lint
      - name: Compile existing guarded SQL harness
        run: >-
          dotnet build QA/tools/SqlHarness/SqlHarness.csproj --nologo
          --artifacts-path .build-check/ci-sql
      - name: Generate actual TSX communication payload fixtures
        run: >-
          node QA/tools/communication-roundtrip.test.cjs |
          tee QA/EVIDENCE/logs/phase-2b-communication-roundtrip-ui.log
      - name: Guarded finance, tenant access and private-file SQL checks
        id: sql_tests
        shell: pwsh
        run: |
          $harness = Join-Path $PWD '.build-check/ci-sql/bin/SqlHarness/debug/SqlHarness.dll'
          foreach ($module in @('Reconciliation', 'CollectionRace', 'Adjustment', 'AdjustmentRace', 'Payroll', 'Transition', 'Consumers', 'Access', 'GuardianFlags', 'EnrollmentShared', 'TeacherCreationShared', 'StudentOnboardingShared', 'PentaHostMigration', 'PentaFoundation', 'PentaTeacherProtected', 'FinanceIntegrity', 'RecordIntegrity', 'ClassMedia', 'CommunicationRoundtrip', 'WorkItemIntegrity', 'ExportSecurity', 'RoleReplacement', 'RoleRevocation', 'SessionRevocationRepair', 'SessionRefresh', 'RefreshConcurrency', 'Recovery')) {
            $env:QA_PENTA_HOST_SECURITY = if ($module -eq 'PentaFoundation') { '1' } else { '' }
            $env:QA_PENTA_TASKS_NATIVE = if ($module -eq 'PentaFoundation') { '1' } else { '' }
            $env:QA_PENTA_QUERIES_NATIVE = if ($module -eq 'PentaFoundation') { '1' } else { '' }
            $env:QA_PENTA_MINI = '0'
            $log = if ($module -eq 'CommunicationRoundtrip') {
              'QA/EVIDENCE/logs/phase-2b-communication-roundtrip-sql.log'
            } else { ".build-check/ci/$module-sql.log" }
            try {
              & ./QA/tools/SqlHarness/Run-ReconciledPayment.ps1 -Module $module -HarnessPath $harness 2>&1 | Tee-Object -FilePath $log
              if ($module -eq 'PentaFoundation') {
                $queries = @(Select-String -LiteralPath $log -Pattern '^PENTA QUERY NATIVE ([0-9]+) SQL/Identity/API checks PASS;')
                if ($queries.Count -ne 1 -or [int]$queries[0].Matches[0].Groups[1].Value -lt 39) {
                  throw 'The connected query SQL/Identity/API packet did not complete.'
                }
              }
              "SQL module ${module}: PASS" >> $env:GITHUB_STEP_SUMMARY
            } catch {
              "SQL module ${module}: FAIL" >> $env:GITHUB_STEP_SUMMARY
              if (Test-Path -LiteralPath $log) {
                Get-Content -LiteralPath $log | Where-Object { $_ -match '^QA failure frame: [A-Za-z0-9_.-]+\.(cs|cjs|js):[0-9]+$' -or $_ -match '^QA client failure: [A-Za-z]+( expected=[0-9]+ actual=[0-9]+)?( missing=[A-Za-z]+)?$' } | Select-Object -Last 10 | ForEach-Object {
                  $_ >> $env:GITHUB_STEP_SUMMARY
                  Write-Output "::error title=SQL $module source location::$_"
                }
              }
              throw
            }
          }
      - name: Guarded private Blob upload, recovery and download checks
        id: blob_tests
        shell: pwsh
        run: |
          $harness = Join-Path $PWD '.build-check/ci-sql/bin/SqlHarness/debug/SqlHarness.dll'
          & ./QA/tools/SqlHarness/Run-BlobMedia.ps1 -HarnessPath $harness 2>&1 | Tee-Object -FilePath '.build-check/ci/blob-media-sql.log'
      - name: Full frontend suite with fresh real SQL evidence
        id: frontend_tests
        working-directory: apps/web
        run: npm test
      - name: Production frontend build
        id: web_build
        working-directory: apps/web
        env:
          # This CI export is used only with intercepted synthetic browser data.
          # The deployment workflow builds its own production-configured export.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:49142
        run: npm run build -- --webpack
      - name: Payroll PDF and assessment browser verification
        id: payroll_browser
        env:
          QA_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.build-check/ci-browser/node_modules/playwright-core
          QA_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          test -x "$QA_BROWSER_EXECUTABLE"
          "$QA_BROWSER_EXECUTABLE" --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          npm install --prefix .build-check/ci-browser --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
          node QA/tools/payroll-print-browser.cjs | tee .build-check/ci/payroll-print-browser.log
          node QA/tools/assessment-isolation-browser.cjs | tee .build-check/ci/assessment-isolation-browser.log
      - name: Build API runtime image
        id: api_image
        run: docker build -f apps/api/Dockerfile -t academydesk-ci-api:${{ github.sha }} .
      - name: API container startup and unavailable-database behavior
        id: api_smoke
        env:
          QA_API_IMAGE: academydesk-ci-api:${{ github.sha }}
        run: bash QA/tools/check-api-container.sh
      - name: Record tested container identities
        run: |
          docker image inspect mcr.microsoft.com/mssql/server:2022-latest --format '{{json .RepoDigests}}' > .build-check/ci/sql-image-digests.json
          docker image inspect mcr.microsoft.com/azure-storage/azurite:latest --format '{{json .RepoDigests}}' > .build-check/ci/azurite-image-digests.json
      - name: Ensure verification did not modify tracked source
        run: git diff --exit-code
      - name: Summarize source and verification outcomes
        if: always()
        env:
          QA_VERIFY_SHA: ${{ github.sha }}
          QA_API_RESULT: ${{ steps.api_tests.outcome }}
          QA_SQL_RESULT: ${{ steps.sql_tests.outcome }}
          QA_BLOB_RESULT: ${{ steps.blob_tests.outcome }}
          QA_FRONTEND_RESULT: ${{ steps.frontend_tests.outcome }}
          QA_WEB_RESULT: ${{ steps.web_build.outcome }}
          QA_PAYROLL_BROWSER_RESULT: ${{ steps.payroll_browser.outcome }}
          QA_IMAGE_RESULT: ${{ steps.api_image.outcome }}
          QA_SMOKE_RESULT: ${{ steps.api_smoke.outcome }}
        run: |
          {
            printf 'Verification source: %s\n\n' "$QA_VERIFY_SHA"
            printf '| Check | Outcome |\n| --- | --- |\n'
            printf '| API tests | %s |\n' "$QA_API_RESULT"
            printf '| Guarded SQL modules | %s |\n' "$QA_SQL_RESULT"
            printf '| Private Blob checks | %s |\n' "$QA_BLOB_RESULT"
            printf '| Full frontend suite | %s |\n' "$QA_FRONTEND_RESULT"
            printf '| Web build | %s |\n' "$QA_WEB_RESULT"
            printf '| Payroll PDF and assessment browser | %s |\n' "$QA_PAYROLL_BROWSER_RESULT"
            printf '| API image build | %s |\n' "$QA_IMAGE_RESULT"
            printf '| API container smoke | %s |\n' "$QA_SMOKE_RESULT"
            printf '\nAutomated verification supplements the required release acceptance gates.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .build-check/ci/
            .build-check/frontend-tests/
            .build-check/payroll-print-browser/
            .build-check/assessment-browser/
            QA/EVIDENCE/logs/phase-2b-communication-roundtrip-ui.log
            QA/EVIDENCE/logs/phase-2b-communication-roundtrip-sql.log

  paired_core:
    name: PENTA protected onboarding and private Core transport
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      QA_PENTA_BRIDGE_SOURCE: ${{ github.workspace }}/.build-check/paired-mini
      QA_PENTA_CORE_SHA: 9dafedb28e3f8c3250659ee60be9cc2abd4b7c47
      QA_PENTA_MINI: '0'
    steps:
      - name: Require access to pinned private Core source
        env:
          PENTA_SOURCE_READ_TOKEN: ${{ secrets.PENTA_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$PENTA_SOURCE_READ_TOKEN" ]; then
            echo "::error::Configure PENTA_SOURCE_READ_TOKEN with read-only contents access to AcademyDesk/PentaMini."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned paired Core source for scripted host transport
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AcademyDesk/PentaMini
          ref: ${{ env.QA_PENTA_CORE_SHA }}
          path: .build-check/paired-mini
          token: ${{ secrets.PENTA_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Prepare pure Core bridge fixture dependencies
        run: |
          mkdir -p .build-check/paired-ci
          git rev-parse HEAD > .build-check/paired-ci/source-commit.txt
          git -C "$QA_PENTA_BRIDGE_SOURCE" rev-parse HEAD > .build-check/paired-ci/core-commit.txt
          test "$(cat .build-check/paired-ci/core-commit.txt)" = "$QA_PENTA_CORE_SHA"
          python -m pip install -r QA/tools/requirements-penta-bridge.txt
      - name: Compile existing guarded SQL harness
        run: >-
          dotnet build QA/tools/SqlHarness/SqlHarness.csproj --nologo
          --artifacts-path .build-check/paired-sql
      - name: Verify protected onboarding and actual scripted Core transport on SQL
        shell: pwsh
        run: |
          $harness = Join-Path $PWD '.build-check/paired-sql/bin/SqlHarness/debug/SqlHarness.dll'
          $log = '.build-check/paired-ci/penta-onboarding-sql.log'
          & ./QA/tools/SqlHarness/Run-ReconciledPayment.ps1 -Module PentaOnboardingProtected -HarnessPath $harness 2>&1 |
            Tee-Object -FilePath $log
          $bridgeChecks = @(Select-String -LiteralPath $log -Pattern '^PASS: PENTAPRIVATEBRIDGE ')
          if ($bridgeChecks.Count -ne 5) { throw 'Expected all five actual private Core transport checks.' }
      - name: Ensure paired verification did not modify tracked source
        run: git diff --exit-code
      - name: Preserve paired Core verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-core-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: .build-check/paired-ci/
