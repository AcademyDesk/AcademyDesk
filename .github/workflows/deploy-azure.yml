name: Deploy AcademyDesk to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Azure Container Apps accepts one configuration update at a time. Queue commits
# rather than letting two GitHub runs race to update the production application.
concurrency:
  group: academydesk-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      web_api_url: ${{ vars.PRODUCTION_API_URL }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Retrieve verified API artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: api-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/academydesk-ci/api
      - name: Retrieve verified web artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/academydesk-ci/web
      - name: Verify exact candidate source, content and web API origin before Azure access
        env:
          WEB_API_ORIGIN: ${{ vars.PRODUCTION_API_URL }}
        run: |
          node QA/tools/ci-release-artifacts.cjs verify "$RUNNER_TEMP/academydesk-ci/api" api "$GITHUB_SHA" unused
          node QA/tools/ci-release-artifacts.cjs verify "$RUNNER_TEMP/academydesk-ci/web" web "$GITHUB_SHA" "$WEB_API_ORIGIN"
          gzip --decompress --stdout "$RUNNER_TEMP/academydesk-ci/api/api-image.tar.gz" | docker load
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Sign in to Container Registry
        run: az acr login --name ${{ vars.AZURE_REGISTRY_NAME }}
      - name: Promote the verified API image
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
        run: |
          docker tag "academydesk-api:$GITHUB_SHA" "$REGISTRY/academydesk-api:$GITHUB_SHA"
          docker push "$REGISTRY/academydesk-api:$GITHUB_SHA"
      - name: Configure API database and registry access
        env:
          SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          WEB_APP_ORIGIN: ${{ vars.WEB_APP_ORIGIN }}
          REGISTRY: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
        run: |
          az containerapp registry set --name ${{ vars.AZURE_API_CONTAINER_APP }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --server "$REGISTRY" --identity system
          az containerapp secret set --name ${{ vars.AZURE_API_CONTAINER_APP }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --secrets "sql-connection=$SQL_CONNECTION_STRING"
          az containerapp ingress enable --name ${{ vars.AZURE_API_CONTAINER_APP }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --type external --target-port 8080
          az containerapp update --name ${{ vars.AZURE_API_CONTAINER_APP }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --cpu 0.5 --memory 1.0Gi --min-replicas 1 --max-replicas 3 --set-env-vars "ConnectionStrings__DefaultConnection=secretref:sql-connection" "Cors__AllowedOrigins__0=$WEB_APP_ORIGIN" "Database__ApplyMigrationsOnStartup=true"
      - name: Configure initial Platform Owner when provided
        env:
          PLATFORM_OWNER_EMAIL: ${{ vars.PLATFORM_OWNER_EMAIL }}
          PLATFORM_OWNER_NAME: ${{ vars.PLATFORM_OWNER_NAME }}
          PLATFORM_OWNER_PASSWORD: ${{ secrets.PLATFORM_OWNER_PASSWORD }}
        run: |
          if [ -z "$PLATFORM_OWNER_EMAIL" ] || [ -z "$PLATFORM_OWNER_PASSWORD" ]; then
            echo "Platform Owner bootstrap is not configured yet."
            exit 0
          fi
          az containerapp secret set --name ${{ vars.AZURE_API_CONTAINER_APP }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --secrets "owner-password=$PLATFORM_OWNER_PASSWORD"
          az containerapp update --name ${{ vars.AZURE_API_CONTAINER_APP }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --set-env-vars "Bootstrap__PlatformOwnerEmail=$PLATFORM_OWNER_EMAIL" "Bootstrap__PlatformOwnerDisplayName=$PLATFORM_OWNER_NAME" "Bootstrap__PlatformOwnerPassword=secretref:owner-password"
      - name: Deploy API container app
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          containerAppName: ${{ vars.AZURE_API_CONTAINER_APP }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}/academydesk-api:${{ github.sha }}
      - name: Place the verified static web portal
        run: |
          test ! -e apps/web/out
          cp -R "$RUNNER_TEMP/academydesk-ci/web/out" apps/web/out
      - name: Deploy static web portal
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/out
          output_location: ""
          skip_app_build: true
