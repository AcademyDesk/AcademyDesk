server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Next 16.4 emits direct segment payloads. The build hook also prepares
    # direct aliases for the preserved older export layout. Never rewrite a
    # valid flat payload into a missing nested path or serve HTML for RSC data.
    location ~ \.txt$ {
        try_files $uri =404;
    }

    location / {
        # Pages use route.html; no catch-all index.html for unknown routes.
        try_files $uri $uri.html $uri/index.html =404;
    }
}
