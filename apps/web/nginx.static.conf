server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location / {
        # Next static export writes route.html. Do not treat a missing directory as the match,
        # or nginx returns 403 before the .html file is considered.
        try_files $uri $uri.html $uri/index.html =404;
    }
}
