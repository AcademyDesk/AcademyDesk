server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Next 16's static segment URLs use dots, while the exported __PAGE__
    # payload is nested in directories. Match only the known static segment
    # grammar; never fall back to HTML for an absent Flight payload.
    location ~ /__next\.[A-Za-z0-9_.-]+\.__PAGE__\.txt$ {
        rewrite ^(.*)/__next\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.__PAGE__\.txt$ $1/__next.$2/$3/$4/__PAGE__.txt break;
        rewrite ^(.*)/__next\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.__PAGE__\.txt$ $1/__next.$2/$3/__PAGE__.txt break;
        rewrite ^(.*)/__next\.([A-Za-z0-9_-]+)\.__PAGE__\.txt$ $1/__next.$2/__PAGE__.txt break;
        try_files $uri =404;
    }

    location / {
        # Next static export writes route.html. Do not treat a missing directory as the match,
        # or nginx returns 403 before the .html file is considered.
        try_files $uri $uri.html $uri/index.html =404;
    }
}
